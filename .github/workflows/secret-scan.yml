name: Secret scan

# Every tracked file, on every push and pull request: AWS, Google (Gemini), Anthropic and
# OpenAI keys, GitHub, Slack and Stripe tokens, private keys, and committed .env or key
# files. Python's standard library only: no accounts, no secrets, no network. Findings are
# reported by file and line, never by value. A real key found here must be revoked at the
# provider first; removing it from the repository afterwards doesn't un-leak it.
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tracked-files:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Scan tracked files for credentials
        run: python backend/scripts/scan_secrets.py --github
