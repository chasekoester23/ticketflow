name: Workers under load on PostgreSQL

# Several fictional companies upload at once while two database-coordinated workers read
# them with a stand-in reader, one worker is killed partway, and every total is checked.
# No AI provider, no keys, nothing outside this job's own database. Same pattern as
# load-test.yml; a separate workflow so it doesn't start the long scale job.
on:
  push:
    branches: ["feature/**"]
    paths:
      - "backend/app/services/jobqueue.py"
      - "backend/app/services/pipeline.py"
      - "backend/app/services/usage.py"
      - "backend/app/db.py"
      - "backend/scripts/run_worker.py"
      - "backend/scripts/worker_load_test.py"
      - "backend/migrations/**"
      - ".github/workflows/worker-load-test.yml"
  workflow_dispatch:
    inputs:
      companies:
        description: "Companies uploading at once"
        default: "4"
      uploads:
        description: "Four-ticket scans each company uploads"
        default: "5"
      workers:
        description: "Worker processes"
        default: "2"

permissions:
  contents: read

env:
  PERF_URL: postgresql://ticketflow:ci-only-not-a-secret@localhost:5432/ticketflow_perf

jobs:
  workers:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ticketflow
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: ticketflow_perf
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U ticketflow" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev.txt
            backend/requirements-postgres.txt
            backend/constraints.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-postgres.txt -c constraints.txt
      - name: Companies uploading at once, two workers, one killed partway
        run: |
          python scripts/worker_load_test.py --companies ${{ inputs.companies || '4' }} --uploads ${{ inputs.uploads || '5' }} \
            --workers ${{ inputs.workers || '2' }} --kill-one --database-url "$PERF_URL" --json workers.json
      - name: Results as notices
        if: always()
        run: |
          python - <<'SCRIPT'
          import json, os
          if os.path.exists("workers.json"):
              r = json.load(open("workers.json"))
              verdict = "every ticket once, each with its own company" if not r["problems"] else "PROBLEMS: " + "; ".join(r["problems"])
              print(f"::notice title=Workers under load, PostgreSQL::{r['machine']}. {r['companies']} companies x {r['uploads_each']} scans, "
                    f"{r['workers']} workers (one killed: {r['killed_worker']}), limit {r['per_company_limit']} job per company. "
                    f"{r['tickets']} of {r['expected_tickets']} tickets in {r['seconds']} s; {r['reads']} reads "
                    f"({r['re_reads_after_kill']} again after the kill); job attempts {r['job_attempts']}; "
                    f"peak running per company {r['peak_running_per_company']}. {verdict}.")
          SCRIPT
