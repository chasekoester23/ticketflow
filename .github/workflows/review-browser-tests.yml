name: Review browser tests

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/review-browser-tests.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/review-browser-tests.yml"

permissions:
  contents: read

jobs:
  review-browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install app dependencies
        run: npm ci
      - name: Install browser test runner without modifying the lockfile
        run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Test ticket review interactions
        run: npx playwright test --config tests/playwright.config.mjs
