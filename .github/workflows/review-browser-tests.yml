name: Review browser tests

on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/review-browser-tests.yml"
  push:
    branches: [main, "feature/**"]
    paths:
      - "frontend/**"
      - ".github/workflows/review-browser-tests.yml"
  workflow_dispatch:
    inputs:
      repeat:
        description: "Run each test this many times, to hunt for flaky tests"
        default: "1"
      throttle:
        description: "Flake hunt: slow the browser's CPU this many times (1 = ordinary run, retries on)"
        default: "1"
      load:
        description: "Flake hunt: busy processes competing for the runner's CPU"
        default: "0"

permissions:
  contents: read

jobs:
  review-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install app dependencies
        run: npm ci
      - name: Install browser test runner without modifying the lockfile
        run: npm install --no-save --package-lock=false @playwright/test@1.61.0
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Test ticket review interactions
        if: ${{ (inputs.throttle || '1') == '1' && (inputs.load || '0') == '0' }}
        run: npx playwright test --config tests/playwright.config.mjs --repeat-each "${{ inputs.repeat || '1' }}"
      - name: Hunt for flaky tests on a slowed, busy machine, with retries off
        if: ${{ (inputs.throttle || '1') != '1' || (inputs.load || '0') != '0' }}
        env:
          CI: "1"
          FLAKE_REPEAT: ${{ inputs.repeat }}
          FLAKE_THROTTLE: ${{ inputs.throttle }}
          FLAKE_LOAD: ${{ inputs.load }}
        run: tests/e2e/flake-hunt.sh
      - name: Keep the report when something fails
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 14
