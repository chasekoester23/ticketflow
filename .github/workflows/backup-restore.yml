name: Backup and restore drill

# Encrypted PostgreSQL backups, end to end: pg_dump of a fictional business, sealed with
# AES-256-GCM, to MinIO standing in for the backup bucket, then pg_restore into a SECOND
# database and checked count for count and cent for cent, with the source proved
# untouched. Free: PostgreSQL and MinIO run inside the job. No real keys or data.
on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backup-restore.yml"
  push:
    branches: [main, "feature/**"]
    paths:
      - "backend/**"
      - ".github/workflows/backup-restore.yml"
  schedule:
    - cron: "41 5 * * 1"  # weekly, so a drift in pg_dump or MinIO shows even without a push
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drill:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ticketflow
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ticketflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGPASSWORD: ci-only-not-a-secret
      BACKUP_TEST_SOURCE_URL: postgresql://ticketflow:ci-only-not-a-secret@localhost:5432/tf_backup_source_test
      BACKUP_TEST_TARGET_URL: postgresql://ticketflow:ci-only-not-a-secret@localhost:5432/tf_restore_target_test
      BACKUP_TEST_S3_ENDPOINT: http://localhost:9000
      BACKUP_TEST_S3_ACCESS_KEY: ci-minio-user
      BACKUP_TEST_S3_SECRET: ci-only-not-a-secret
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev.txt
            backend/requirements-postgres.txt
            backend/requirements-backup.txt
            backend/constraints.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-postgres.txt -r requirements-backup.txt -c constraints.txt
      - name: PostgreSQL 16 client tools
        run: |
          if ! pg_dump --version | grep -q " 1[6-9]\."; then
            sudo apt-get update -q && sudo apt-get install -y -q postgresql-client-16 || sudo apt-get install -y -q postgresql-client
          fi
          pg_dump --version && pg_restore --version
      - name: Start MinIO
        # MinIO's own images, newest pinned release first; then its server binary. Each
        # attempt that fails is named in an annotation, and the one used in a notice.
        run: |
          started=""
          for image in quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z minio/minio:RELEASE.2025-04-22T22-12-26Z \
                       quay.io/minio/minio:latest minio/minio:latest; do
            if out=$(docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER="$BACKUP_TEST_S3_ACCESS_KEY" \
                     -e MINIO_ROOT_PASSWORD="$BACKUP_TEST_S3_SECRET" "$image" server /data 2>&1); then
              started="$image"; break
            fi
            echo "::warning title=MinIO::$image didn't start: $(echo "$out" | tail -1)"
            docker rm -f minio >/dev/null 2>&1 || true
          done
          if [ -z "$started" ]; then
            curl -sfL -o "$RUNNER_TEMP/minio" https://dl.min.io/server/minio/release/linux-amd64/minio
            chmod +x "$RUNNER_TEMP/minio" && mkdir -p "$RUNNER_TEMP/minio-data"
            MINIO_ROOT_USER="$BACKUP_TEST_S3_ACCESS_KEY" MINIO_ROOT_PASSWORD="$BACKUP_TEST_S3_SECRET" \
              nohup "$RUNNER_TEMP/minio" server "$RUNNER_TEMP/minio-data" --address :9000 > "$RUNNER_TEMP/minio.log" 2>&1 &
            started="server binary from dl.min.io"
          fi
          echo "::notice title=MinIO::$started"
          for i in $(seq 1 60); do curl -sf http://localhost:9000/minio/health/live && exit 0; sleep 1; done
          docker logs minio 2>/dev/null || cat "$RUNNER_TEMP/minio.log"; exit 1
      - name: Create the source and target databases
        run: |
          createdb -h localhost -U ticketflow tf_backup_source_test
          createdb -h localhost -U ticketflow tf_restore_target_test
      - name: Back up, restore into the second database, verify
        run: python -m pytest -q -s -p no:cacheprovider --junitxml=results.xml tests/test_c_backup_pg_live.py tests/test_c_backups.py
      - name: Name every failure in one annotation
        if: always()
        run: python scripts/ci_report_failures.py results.xml
