name: Load and scale on PostgreSQL

# Fictional data on a GitHub runner, so the figures compare runs and show limits. They
# are not a promise about production hardware. Results appear as notices, which anyone
# can read without access to the run's logs.
on:
  push:
    branches: ["feature/**"]
    paths:
      - "backend/scripts/load_test.py"
      - "backend/scripts/measure_performance.py"
      - ".github/workflows/load-test.yml"
  workflow_dispatch:
    inputs:
      users:
        description: "Simultaneous employees, space separated"
        default: "1 5 20"
      seconds:
        description: "Seconds each load run lasts"
        default: "30"
      sizes:
        description: "Ticket counts for measure_performance.py, space separated"
        default: "1000 10000 100000"

permissions:
  contents: read

env:
  PERF_URL: postgresql://ticketflow:ci-only-not-a-secret@localhost:5432/ticketflow_perf

jobs:
  load:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ticketflow
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: ticketflow_perf
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U ticketflow" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev.txt
            backend/requirements-postgres.txt
            backend/constraints.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-postgres.txt -c constraints.txt
      - name: Employees at once on a real server
        run: |
          python scripts/load_test.py --users ${{ inputs.users || '1 5 20' }} --seconds ${{ inputs.seconds || '30' }} \
            --tickets 20000 --database-url "$PERF_URL" --json load.json
      - name: Results as notices
        if: always()
        run: |
          python - <<'SCRIPT'
          import json, os
          if os.path.exists("load.json"):
              report = json.load(open("load.json"))
              for run in report["runs"]:
                  acts = "; ".join(f"{k} {v['requests']} req p50 {v['p50_ms']} p95 {v['p95_ms']} p99 {v['p99_ms']} ms, {v['errors']} errors, {v['conflicts_409']} refused"
                                   for k, v in run["actions"].items())
                  verdict = "exact, nothing counted twice" if not run["problems"] else "PROBLEMS: " + "; ".join(run["problems"])
                  print(f"::notice title=Load, {run['users']} employees, PostgreSQL::{report['machine']}. {run['requests']} requests in "
                        f"{run['seconds']} s, {run['throughput_per_s']}/s, {run['errors']} errors, p50 {run['p50_ms']} p95 {run['p95_ms']} "
                        f"p99 {run['p99_ms']} ms. Load average {run['load_average_before']}. {acts}. Totals {verdict}.")
          SCRIPT

  scale:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ticketflow
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: ticketflow_perf
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U ticketflow" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev.txt
            backend/requirements-postgres.txt
            backend/constraints.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-postgres.txt -c constraints.txt
      - name: measure_performance.py at each size, then query plans at the largest
        env:
          DATABASE_URL: ${{ env.PERF_URL }}
        run: |
          for size in ${{ inputs.sizes || '1000 10000 100000 1000000' }}; do
            # A fresh, empty database at the current schema each time. The tables are made
            # directly and stamped, because the generator brings its own company.
            python - <<'SCRIPT'
          import os
          from sqlalchemy import create_engine, text
          from app.db import Base, normalized_url
          import app.models  # noqa: F401
          engine = create_engine(normalized_url(os.environ["DATABASE_URL"]))
          with engine.begin() as connection:
              connection.execute(text("DROP SCHEMA public CASCADE"))
              connection.execute(text("CREATE SCHEMA public"))
          Base.metadata.create_all(engine)
          SCRIPT
            python -m alembic stamp head > /dev/null
            started=$(date +%s)
            python scripts/measure_performance.py --tickets "$size" --database-url "$PERF_URL" --timeout 300 --json "perf-$size.json" \
              || echo "::warning title=measure_performance at $size tickets::stopped with exit $?"
            echo "$size tickets took $(( $(date +%s) - started )) s in all; load average $(cut -d' ' -f1-3 /proc/loadavg)"
            if [ "$size" = 100000 ]; then python scripts/load_test.py --explain --database-url "$PERF_URL" --json plans.json; fi
          done
      - name: Results as notices
        if: always()
        run: |
          python - <<'SCRIPT'
          import glob, json, os
          for path in sorted(glob.glob("perf-*.json"), key=lambda p: int(p.split("-")[1].split(".")[0])):
              for run in json.load(open(path))["runs"]:
                  rows = "; ".join(f"{r['request']} {r.get('seconds', '-')} s {r.get('queries', '-')} SQL {r.get('peak_mb', '-')} MB"
                                   + ("" if r.get("ok") else f" ({r.get('limit', 'not ok')})") for r in run["requests"])
                  print(f"::notice title=measure_performance, {run['tickets']:,} tickets, PostgreSQL::generated in {run['generation_seconds']} s. {rows}"[:3900])
          if os.path.exists("plans.json"):
              plans = json.load(open("plans.json"))
              for chunk in range(0, len(plans), 6):
                  text = " || ".join(f"{p['request']}: {p['seconds']} s, {p['statements']} SELECTs, slowest {p['slowest_statement_ms']} ms; indexes "
                                     f"{', '.join(p['indexes_used']) or 'none'}; full scans {', '.join(p['full_scans_over_1000_rows']) or 'none'}"
                                     for p in plans[chunk:chunk + 6])
                  print(f"::notice title=Query plans at 100,000 tickets, part {chunk // 6 + 1}::{text}"[:3900])
          SCRIPT
