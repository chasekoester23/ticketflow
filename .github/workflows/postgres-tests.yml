name: PostgreSQL tests

# The whole backend suite on real PostgreSQL, built by the real migrations.
# Fictional data only. No keys, no AI, and nothing outside this job's own database.
on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/postgres-tests.yml"
  push:
    branches: [main, "feature/**"]
    paths:
      - "backend/**"
      - ".github/workflows/postgres-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ticketflow
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: ticketflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ticketflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://ticketflow:ci-only-not-a-secret@localhost:5432/ticketflow_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev.txt
            backend/requirements-postgres.txt
            backend/constraints.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-postgres.txt -c constraints.txt
      - name: Run the backend suite on PostgreSQL
        # A test stuck for 4 minutes has every thread's stack dumped, and the run stops before
        # the job's own limit, so the next step can name it where logs need no sign-in.
        run: |
          set -o pipefail
          timeout 20m python -m pytest -q -o faulthandler_timeout=240 --junitxml=results.xml -p no:cacheprovider 2>&1 | tee pytest.log
      - name: Name a test that hung
        if: always()
        run: |
          python - <<'SCRIPT'
          import os, re
          if os.path.exists("pytest.log"):
              text = open("pytest.log", errors="replace").read()
              at = text.find("Timeout (")
              if at >= 0:
                  frames = [l.strip() for l in text[at:at + 40000].splitlines() if "/backend/" in l and "site-packages" not in l]
                  print("::error title=Hung test::" + "%0A".join(frames[:60])[:3800])
          SCRIPT
      - name: Name every failure in one annotation
        if: always()
        run: python scripts/ci_report_failures.py results.xml
